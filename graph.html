<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WorkTracker</title>

<style>

    * {
        box-sizing: border-box;
    }


    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #ffffff;
        color: #222;
    }


    h1 {
        margin-bottom: 8px;
    }


    .week-title {
        margin-bottom: 20px;
        color: #555;
        font-size: 16px;
    }


    /* ========================================
       주간 그래프
       ======================================== */

    .week-grid {
        display: grid;

        grid-template-columns:
            50px
            repeat(7, 24px);

        grid-auto-rows: 24px;

        gap: 5px;

        width: max-content;
    }


    /* ========================================
       요일 표시
       ======================================== */

    .day-header {
        width: 24px;
        height: 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 12px;
        color: #555;
    }


    .day-header.today {
        font-weight: bold;
        color: #111;
    }


    /* ========================================
       시간 표시
       ======================================== */

    .hour-label {
        width: 50px;
        height: 24px;

        display: flex;
        align-items: center;

        font-size: 11px;
        color: #777;
    }


    /* ========================================
       작업량 칸
       ======================================== */

    .work-cell {
        width: 24px;
        height: 24px;

        border-radius: 4px;

        cursor: pointer;
    }


    .work-cell:hover {
        outline: 2px solid #555;
        outline-offset: 1px;
    }


    /* ========================================
       작업량 단계
       ======================================== */

    .level-0 {
        background: #ebedf0;
    }

    .level-1 {
        background: #c6e48b;
    }

    .level-2 {
        background: #7bc96f;
    }

    .level-3 {
        background: #239a3b;
    }

    .level-4 {
        background: #196127;
    }

    .level-5 {
        background: #0b3d18;
    }


    /* ========================================
       설명
       ======================================== */

    .legend {
        display: flex;
        align-items: center;

        gap: 5px;

        margin-top: 20px;

        font-size: 12px;
        color: #777;
    }


    .legend-cell {
        width: 16px;
        height: 16px;
        border-radius: 3px;
    }


    /* ========================================
       선택한 시간 정보
       ======================================== */

    .detail {
        margin-top: 35px;

        padding-top: 25px;

        border-top: 1px solid #ddd;

        max-width: 500px;

        font-size: 20px;

    .detail-time {
        color: #555;

    /* ========================================
       모바일

    @media (max-width: 600px) {

        body {
            margin: 25px 20px;

        .week-grid {
            grid-template-columns:
                38px

            grid-auto-rows: 20px;

</style>

</head>


<body>


<h1>WorkTracker</h1>


<div
    class="week-title"
    id="week-title"
>
    이번 주
</div>


<!-- ========================================
     7열 × 24행 주간 잔디 그래프
     ======================================== -->

<div
    class="week-grid"
    id="week-grid"
></div>


<!-- ========================================
     범례
     ======================================== -->

<div class="legend">

    <span>적음</span>

    <div class="legend-cell level-0"></div>
    <div class="legend-cell level-1"></div>
    <div class="legend-cell level-2"></div>
    <div class="legend-cell level-3"></div>
    <div class="legend-cell level-4"></div>
    <div class="legend-cell level-5"></div>

    <span>많음</span>

</div>


<!-- ========================================
     선택한 시간
     ======================================== -->

<div
    class="detail"
    id="detail"
>

    <div
        class="detail-title"
        id="detail-title"
    >
        시간대를 선택해주세요.
    </div>


    <div
        class="detail-time"
        id="detail-time"
    >
        작업시간: -
    </div>

</div>


<script>


// ========================================
// Supabase
// ========================================

const SUPABASE_URL =
    "https://hmaicgmzobzolwydkysc.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_N51dEQq1SRYJrKrgH79zOA_ZnnQ7juR";


// ========================================
// API 호출
// ========================================

async function fetchAPI(endpoint) {

    const response = await fetch(
        SUPABASE_URL + endpoint,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                    `Bearer ${SUPABASE_KEY}`
            }
        }
    );


    if (!response.ok) {

        throw new Error(
            `Supabase API 오류: ${response.status}`
        );

    }


    return await response.json();

}


// ========================================
// 날짜 → YYYY-MM-DD
// ========================================

function getDateString(date) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


// ========================================
// 작업시간 표시
// ========================================

function formatTime(seconds) {

    seconds =
        Math.floor(seconds);


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const remainingSeconds =
        seconds % 60;


    if (hours > 0) {

        return (
            hours +
            "시간 " +
            minutes +
            "분 " +
            remainingSeconds +
            "초"
        );

    }


    if (minutes > 0) {

        return (
            minutes +
            "분 " +
            remainingSeconds +
            "초"
        );

    }


    return (
        remainingSeconds +
        "초"
    );

}


// ========================================
// 작업량 단계
// ========================================

function getLevel(seconds) {

    const minutes =
        seconds / 60;


    if (seconds <= 0) {
        return 0;
    }


    if (minutes < 15) {
        return 1;
    }


    if (minutes < 30) {
        return 2;
    }


    if (minutes < 45) {
        return 3;
    }


    if (minutes < 60) {
        return 4;
    }


    return 5;

}


// ========================================
// 이번 주 월요일
// ========================================

function getMonday(date) {

    const monday =
        new Date(date);


    monday.setHours(
        0,
        0,
        0,
        0
    );


    const day =
        monday.getDay();


    const difference =
        day === 0
            ? -6
            : 1 - day;


    monday.setDate(
        monday.getDate() +
        difference
    );


    return monday;

}


// ========================================
// 요일 이름
// ========================================

const DAY_NAMES = [
    "월",
    "화",
    "수",
    "목",
    "금",
    "토",
    "일"
];


// ========================================
// 이번 주 데이터 로드
// ========================================

async function loadData() {

    try {

        const today =
            new Date();


        const monday =
            getMonday(today);


        const sunday =
            new Date(monday);


        sunday.setDate(
            sunday.getDate() + 6
        );


        const startDate =
            getDateString(monday);


        const endDate =
            getDateString(sunday);


        // ----------------------------
        // 제목
        // ----------------------------

        document.getElementById(
            "week-title"
        ).textContent =
            `${startDate} ~ ${endDate}`;


        // ----------------------------
        // 이번 주 데이터만 가져오기
        // ----------------------------

        const endpoint =
            "/rest/v1/work_time" +
            "?select=date,hour,seconds" +
            "&date=gte." +
            startDate +
            "&date=lte." +
            endDate +
            "&order=date,hour";


        const rows =
            await fetchAPI(
                endpoint
            );


        // ----------------------------
        // 날짜/시간 데이터 정리
        // ----------------------------

        const data = {};


        for (
            let dayIndex = 0;
            dayIndex < 7;
            dayIndex++
        ) {

            const date =
                new Date(monday);


            date.setDate(
                date.getDate() +
                dayIndex
            );


            const dateString =
                getDateString(date);


            data[dateString] = {};


            for (
                let hour = 0;
                hour < 24;
                hour++
            ) {

                data[dateString][hour] =
                    0;

            }

        }


        // ----------------------------
        // Supabase 데이터 입력
        // ----------------------------

        for (const row of rows) {

            const date =
                row.date;

            const hour =
                Number(row.hour);

            const seconds =
                Number(row.seconds);


            if (
                data[date] &&
                hour >= 0 &&
                hour <= 23
            ) {

                data[date][hour] =
                    seconds;

            }

        }


        // ----------------------------
        // 그래프 생성
        // ----------------------------

        renderGraph(
            monday,
            today,
            data
        );


        console.log(
            "이번 주 데이터 갱신 완료"
        );


    } catch (error) {

        console.error(
            "데이터 갱신 실패:",
            error
        );

    }

}


// ========================================
// 7 × 24 그래프
// ========================================

function renderGraph(
    monday,
    today,
    data
) {

    const graph =
        document.getElementById(
            "week-grid"
        );


    graph.innerHTML = "";


    // ====================================
    // 첫 번째 행
    // 왼쪽 빈 공간 + 요일
    // ====================================

    const emptyHeader =
        document.createElement(
            "div"
        );


    graph.appendChild(
        emptyHeader
    );


    for (
        let dayIndex = 0;
        dayIndex < 7;
        dayIndex++
    ) {

        const date =
            new Date(monday);


        date.setDate(
            date.getDate() +
            dayIndex
        );


        const header =
            document.createElement(
                "div"
            );


        header.className =
            "day-header";


        const dateString =
            getDateString(date);


        header.textContent =
            DAY_NAMES[dayIndex];


        // 오늘이면 강조

        if (
            dateString ===
            getDateString(today)
        ) {

            header.classList.add(
                "today"
            );

        }


        header.title =
            dateString;


        graph.appendChild(
            header
        );

    }


    // ====================================
    // 24시간
    // ====================================

    for (
        let hour = 0;
        hour < 24;
        hour++
    ) {

        // -------------------------------
        // 시간 표시
        // -------------------------------

        const hourLabel =
            document.createElement(
                "div"
            );


        hourLabel.className =
            "hour-label";


        hourLabel.textContent =
            String(hour).padStart(
                2,
                "0"
            ) + ":00";


        graph.appendChild(
            hourLabel
        );


        // -------------------------------
        // 월 ~ 일
        // -------------------------------

        for (
            let dayIndex = 0;
            dayIndex < 7;
            dayIndex++
        ) {

            const date =
                new Date(monday);


            date.setDate(
                date.getDate() +
                dayIndex
            );


            const dateString =
                getDateString(date);


            const seconds =
                Number(
                    data[dateString]?.[hour] ||
                    0
                );


            // ---------------------------
            // 칸 생성
            // ---------------------------

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "work-cell";


            // ---------------------------
            // 색상 단계
            // ---------------------------

            cell.classList.add(
                "level-" +
                getLevel(seconds)
            );


            // ---------------------------
            // 툴팁
            // ---------------------------

            const hourText =
                String(hour).padStart(
                    2,
                    "0"
                );


            cell.title =
                `${dateString} ${hourText}:00\n` +
                `작업시간: ${formatTime(seconds)}`;


            // ---------------------------
            // 클릭
            // ---------------------------

            cell.addEventListener(
                "click",
                () => {

                    document.getElementById(
                        "detail-title"
                    ).textContent =
                        `${dateString} ${hourText}:00`;


                    document.getElementById(
                        "detail-time"
                    ).textContent =
                        "작업시간: " +
                        formatTime(
                            seconds
                        );

                }
            );


            graph.appendChild(
                cell
            );

        }

    }

}


// ========================================
// 처음 로드
// ========================================

loadData();


// ========================================
// 10분마다 자동 갱신
// ========================================

setInterval(
    loadData,
    600000
);


</script>


</body>

</html>
